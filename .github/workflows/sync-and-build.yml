# 放到 jieluojun/mihomo 的 Alpha 分支 .github/workflows/sync-and-build.yml
# 功能: 同步上游 Alpha → 重新 git am 补丁 → 编译全架构 eBPF 版 → 发布滚动 Release
#
# 只保留一条 Alpha 分支（不再维护 with-at）。补丁文件在同仓库 fork-sync/。
# 每 30 分钟检查上游；仅上游 SHA 与上次成功发布的 SHA 不同才同步和构建。
# 首次没有记录时构建一次；失败不更新记录，下次检查自动重试。
# 需要构建时先备份 fork-sync/ 和工作流，再 reset --hard 上游，然后 am。
#
# 构建范围：与模块 core_arch_token() / core_jieluojun_supported() 的 token 列表一一对应
#   Linux  ：386 · 386-softfloat · amd64-v1 · amd64-v2 · amd64-v3 · arm64 · armv5 · armv6 · armv7
#            mips-softfloat · mipsle-softfloat · mips64 · mips64le · loong64-abi1 · riscv64 · s390x · ppc64le
#   Android：386 · amd64 · armv7 · arm64-v8
# 产物命名与上游 build.yml 一致：mihomo-<goos>-<输出名>-<VERSION>.gz
#   例：mihomo-linux-amd64-v3-alpha-smart-<sha>-with-at.gz
#
# 前提: 仓库 Settings -> Actions -> General -> Workflow permissions 设为
#       "Read and write permissions"

name: sync-upstream-and-build

on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制构建（即使上游没有更新）"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17,47 * * * *" # 每 30 分钟检查一次，避开整点；实际执行可能延迟

# 避免定时与手动运行同时重置分支、发布 Release。
concurrency:
  group: sync-upstream-and-build-Alpha
  cancel-in-progress: false

# GITHUB_TOKEN 不能创建/更新 .github/workflows/*（上游 Alpha 自带 test.yml）。
# 在仓库 Settings → Secrets → Actions 添加 SYNC_PAT：
#   经典 PAT，勾选 repo + workflow。
permissions:
  contents: write

env:
  UPSTREAM: https://github.com/liuran001/mihomo.git
  UPSTREAM_BRANCH: Alpha
  WORKFLOW_PATH: .github/workflows/sync-and-build.yml
  STATE_PATH: fork-sync/.last-built-upstream

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Alpha
        uses: actions/checkout@v4
        with:
          ref: Alpha
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Check upstream updates
        id: check
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          upstream_sha="$(git rev-parse "refs/remotes/upstream/$UPSTREAM_BRANCH")"
          fork_sha="$(git rev-parse HEAD)"
          last_built=""
          if [[ -f "$STATE_PATH" ]]; then
            last_built="$(cat "$STATE_PATH")"
          fi
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"
          echo "Upstream: $upstream_sha"
          echo "Last successful build: ${last_built:-none}"

          # 不比较 fork 的 HEAD：本地补丁和 CI 提交会让 HEAD 始终不同。
          if [[ "$FORCE_BUILD" != "true" && "$upstream_sha" == "$last_built" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游没有更新，跳过同步、构建和发布。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "需要构建，上游提交：$upstream_sha（首次运行、上游更新或手动强制）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reset to upstream and re-apply patches
        if: steps.check.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
          FORK_SHA: ${{ steps.check.outputs.fork_sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # reset 会清掉工作区：拷走整个 fork-sync/（含 sync.sh、README、补丁）和工作流
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp -a fork-sync "$tmp/fork-sync"
          cp -a "$WORKFLOW_PATH" "$tmp/workflow.yml"

          git checkout -B "$UPSTREAM_BRANCH"
          # 使用检查阶段固定的 SHA，避免一次运行中检测与构建的版本不一致。
          git reset --hard "$UPSTREAM_SHA"

          mkdir -p .github/workflows
          rm -rf fork-sync
          cp -a "$tmp/fork-sync" fork-sync
          cp "$tmp/workflow.yml" "$WORKFLOW_PATH"
          git add "$WORKFLOW_PATH" fork-sync
          git diff --cached --quiet || git commit -m "ci: keep sync workflow and patch series on Alpha"

          git am --3way fork-sync/[0-9][0-9][0-9][0-9]-*.patch
          # 检查后若有人推送了新提交，拒绝覆盖，下一次运行再重试。
          git push --force-with-lease="refs/heads/$UPSTREAM_BRANCH:$FORK_SHA" \
            origin "HEAD:refs/heads/$UPSTREAM_BRANCH"

      # 与上游 liuran001/mihomo Alpha 的 build.yml 相同：官方 setup-go@v5
      # 没有 go-download-base-url，要用带该参数的 commit（MetaCubeX 的 Go 1.26）。
      - name: Setup Go
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26'
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'

      - name: Sanity test
        if: steps.check.outputs.changed == 'true'
        run: |
          go test ./adapter/outbound/ -run 'TestHttpConnectLine|TestCnsRequestHeader' -v

      # 与上游 build.yml 相同：先更新 CA，再编译（component/ca 不存在时跳过）。
      - name: Update CA
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if [ -d component/ca ]; then
            sudo apt-get update && sudo apt-get install -y ca-certificates
            sudo update-ca-certificates
            cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt
          fi

      # android 的 386 / amd64 / arm / arm64 都需要 NDK（cgo 链接）。
      - name: Setup NDK
        if: steps.check.outputs.changed == 'true'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      # 全部自动选择架构（Go 1.26 标准工具链）。
      # build <goos> <goarch> <输出名> [KEY=VALUE ...]
      #   · linux 纯 Go（CGO_ENABLED=0）+ 静态链接，android 走 NDK clang（CGO_ENABLED=1）
      #   · 标签与上游一致：linux / android 带 with_gvisor,with_ebpf
      - name: Build binaries
        if: steps.check.outputs.changed == 'true'
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          VERSION="alpha-smart-$(git rev-parse --short HEAD)-with-at"
          BUILDTIME="$(date -u)"
          LDX="-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          TOOLBIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build-out

          build() {
            local goos=$1 goarch=$2 out=$3; shift 3
            local name="mihomo-${goos}-${out}"
            local tags="with_gvisor"
            local ldtag=""
            if [ "$goos" = linux ] || [ "$goos" = android ]; then tags="with_gvisor,with_ebpf"; fi
            if [ "$goos" = linux ]; then ldtag="-extldflags --static"; fi
            echo "::group::build $name"
            env "$@" GOOS="$goos" GOARCH="$goarch" go build -v -tags "$tags" -trimpath \
              -ldflags "$ldtag $LDX" -o "build-out/$name" .
            gzip -c "build-out/$name" > "build-out/${name}-${VERSION}.gz"
            rm -f "build-out/$name"
            echo "::endgroup::"
          }

          # —— Linux ——
          build linux 386     386                 GO386=sse2      CGO_ENABLED=0
          build linux 386     386-softfloat       GO386=softfloat CGO_ENABLED=0
          build linux amd64   amd64-v1            GOAMD64=v1      CGO_ENABLED=0
          build linux amd64   amd64-v2            GOAMD64=v2      CGO_ENABLED=0
          build linux amd64   amd64-v3            GOAMD64=v3      CGO_ENABLED=0
          build linux arm64   arm64                               CGO_ENABLED=0
          build linux arm     armv5               GOARM=5         CGO_ENABLED=0
          build linux arm     armv6               GOARM=6         CGO_ENABLED=0
          build linux arm     armv7               GOARM=7         CGO_ENABLED=0
          build linux mips    mips-softfloat      GOMIPS=softfloat CGO_ENABLED=0
          build linux mipsle  mipsle-softfloat    GOMIPS=softfloat CGO_ENABLED=0
          build linux mips64  mips64                              CGO_ENABLED=0
          build linux mips64le mips64le                           CGO_ENABLED=0
          build linux riscv64 riscv64                             CGO_ENABLED=0
          build linux s390x   s390x                               CGO_ENABLED=0
          build linux ppc64le ppc64le                             CGO_ENABLED=0

          # —— Android（NDK clang）——
          build android 386   386          CGO_ENABLED=1 CC="$TOOLBIN/i686-linux-android34-clang"
          build android amd64 amd64        CGO_ENABLED=1 CC="$TOOLBIN/x86_64-linux-android34-clang"
          build android arm   armv7        CGO_ENABLED=1 GOARM=7 CC="$TOOLBIN/armv7a-linux-androideabi34-clang"
          build android arm64 arm64-v8     CGO_ENABLED=1 CC="$TOOLBIN/aarch64-linux-android34-clang"

          # 版本戳（供模块侧核对）
          echo "$VERSION" > build-out/version.txt
          ls -la build-out

      # loong64-abi1 需要 MetaCubeX 的 loongarch64 专用 Go 工具链（与上游 build.yml 相同），
      # 因此在标准工具链之后单独切换，再编译该目标。setup-go 会把新工具链放到 PATH 最前。
      - name: Setup Go 1.26 loongarch abi1
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/loongarch64-golang/releases/download/1.26.0'
          go-version: 1.26.0

      - name: Build loong64-abi1
        if: steps.check.outputs.changed == 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go version
          VERSION="$(cat build-out/version.txt)"
          BUILDTIME="$(date -u)"
          LDX="-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          name="mihomo-linux-loong64-abi1"
          GOOS=linux GOARCH=loong64 CGO_ENABLED=0 go build -v -tags "with_gvisor,with_ebpf" -trimpath \
            -ldflags "-extldflags --static $LDX" -o "build-out/$name" .
          gzip -c "build-out/$name" > "build-out/${name}-${VERSION}.gz"
          rm -f "build-out/$name"
          ls -la build-out

      - name: Clean stale assets from rolling release
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT
          status="$(curl -sS -o "$release_json" -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/with-at-latest")"
          echo "release lookup -> HTTP $status"
          if [[ "$status" == "404" ]]; then
            echo "rolling release does not exist yet; nothing to clean"
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            echo "release lookup failed (HTTP $status)" >&2
            cat "$release_json" >&2
            exit 1
          fi
          ids="$(jq -r '.assets[]?.id' "$release_json")"
          for id in $ids; do
            status="$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id")"
            echo "delete asset id=$id -> HTTP $status"
            if [[ "$status" != "204" ]]; then
              echo "failed to delete release asset $id (HTTP $status)" >&2
              exit 1
            fi
          done

      - name: Publish rolling release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: with-at-latest
          name: "With-At eBPF build"
          body: "自动构建：上游 liuran001/mihomo@Alpha + With-At 补丁（每次同步重新 git am）。覆盖 Linux / Android 全部自动选择架构。内核特性见 https://raw.githubusercontent.com/jieluojun/mihomo/refs/heads/Alpha/fork-sync/README.md"
          files: |
            build-out/mihomo-*.gz
            build-out/version.txt
          make_latest: true

      # 只有前面的构建与发布全部成功才记录 SHA；失败时保留旧值以便重试。
      - name: Record successfully built upstream
        if: steps.check.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$UPSTREAM_SHA" > "$STATE_PATH"
          git add "$STATE_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "ci: record successfully built upstream $UPSTREAM_SHA"
            git push origin "HEAD:refs/heads/$UPSTREAM_BRANCH"
          fi
          echo "构建与发布成功，已记录上游提交：$UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
