# 放到 fork 仓库 with-at 分支的 .github/workflows/sync-and-build.yml
# 功能:同步上游 -> rebase With-At 补丁 -> 编译 eBPF 版 -> 发布滚动 Release
# 前提:仓库 Settings -> Actions -> General -> Workflow permissions 设为
#       "Read and write permissions"

name: sync-upstream-and-build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *" # 每天 20:00 UTC = 北京时间 04:00

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/liuran001/mihomo.git
  UPSTREAM_BRANCH: Alpha
  PATCH_BRANCH: with-at

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: with-at
          fetch-depth: 0

      - name: Sync upstream and rebase With-At patches
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM" || true
          git fetch upstream "$UPSTREAM_BRANCH"

          # 1) fork 的 Alpha 强制对齐上游
          git checkout -B "$UPSTREAM_BRANCH" "upstream/$UPSTREAM_BRANCH"
          git push -f origin "$UPSTREAM_BRANCH"

          # 2) 把 With-At 补丁提交 rebase 到新上游之上
          #    若此处冲突,任务会失败并通知你,按 fork-sync/SYNC.md 第三节手动解决
          git checkout "$PATCH_BRANCH"
          git rebase "upstream/$UPSTREAM_BRANCH"
          git push -f origin "$PATCH_BRANCH"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sanity test
        run: go test ./adapter/outbound/ -run TestHttpConnectLine -v

      - name: Build eBPF binaries (no NDK needed, loader is pure Go)
        run: |
          set -e
          VERSION="alpha-smart-$(git rev-parse --short HEAD)-with-at"
          BUILDTIME="$(date -u)"
          LD="-X \"github.com/metacubex/mihomo/constant.Version=$VERSION\" -X \"github.com/metacubex/mihomo/constant.BuildTime=$BUILDTIME\" -w -s -buildid="
          mkdir -p bin
          GOARCH=arm64 GOOS=linux   CGO_ENABLED=0 go build -tags "with_gvisor with_ebpf" -trimpath -ldflags "$LD" -o bin/mihomo-linux-arm64-ebpf .
          GOARCH=arm64 GOOS=android CGO_ENABLED=0 go build -tags "with_gvisor with_ebpf" -trimpath -ldflags "$LD" -o bin/mihomo-android-arm64-ebpf .
          ./bin/mihomo-linux-arm64-ebpf -v || true # arm64 产物,宿主机无法执行,忽略

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: with-at-latest
          name: "With-At eBPF build (${{ github.run_number }})"
          body: |
            自动构建:上游 liuran001/mihomo@Alpha + With-At 钉钉直连免流补丁。
            版本号 `alpha-smart-<commit>-with-at`,含 `with_gvisor` + `with_ebpf`。
            同步提交:${{ github.sha }}
          files: |
            bin/mihomo-linux-arm64-ebpf
            bin/mihomo-android-arm64-ebpf
          make_latest: true
